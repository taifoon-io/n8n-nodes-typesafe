# Publishes @taifoon/jev (jev/) to npm WITH provenance when a release tagged jev-vX.Y.Z is published.
name: publish-jev
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'jev-v')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: jev } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: The tag must match package.json
        run: test "jev-v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
